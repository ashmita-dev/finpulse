services:
  backend:
    image: finpulse-backend:latest
    container_name: finpulse-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_HOST: host.docker.internal
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: finpulse-frontend:latest
    container_name: finpulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"